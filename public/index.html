:root{font-family:Inter,"PingFang SC",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}.login{max-width:390px;margin:12vh auto;background:white;padding:32px;border-radius:16px;box-shadow:0 12px 40px #18315318}.login h1{margin:0 0 8px}.login p{color:#64748b}.field{display:grid;gap:6px;margin:16px 0}.field input,.field textarea,.field select{border:1px solid #d8e0eb;border-radius:8px;padding:10px 12px;background:white}.btn{border:0;border-radius:8px;padding:10px 15px;background:#315efb;color:white;cursor:pointer}.btn.secondary{background:#eaf0ff;color:#2348c7}.btn.danger{background:#feecec;color:#c53636}.layout{display:none;min-height:100vh}.side{width:230px;background:#172033;color:white;padding:24px 16px}.brand{font-size:20px;font-weight:700;padding:0 10px 24px}.nav{display:block;width:100%;text-align:left;color:#b9c4d7;background:transparent;border:0;padding:12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav.active{background:#315efb;color:white}.main{flex:1;padding:30px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h2{margin:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card,.panel{background:white;border:1px solid #e4e9f0;border-radius:12px;padding:18px}.card h3{margin:0 0 6px}.muted{color:#738096;font-size:14px}.stats{display:flex;gap:18px;margin-top:18px}.stats strong{font-size:22px}.row{display:flex;gap:10px;align-items:center}.space{justify-content:space-between}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;vertical-align:top}.pill{background:#eaf0ff;color:#315efb;padding:4px 8px;border-radius:12px;font-size:12px}.modal{position:fixed;inset:0;background:#10182888;display:none;align-items:center;justify-content:center;padding:20px}.dialog{background:white;border-radius:14px;padding:24px;width:min(620px,100%);max-height:90vh;overflow:auto}.dialog h3{margin-top:0}textarea{min-height:170px;font-family:ui-monospace,monospace}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:white;padding:12px 18px;border-radius:8px;display:none;max-width:480px}@media(max-width:700px){.side{width:80px}.brand{font-size:0}.brand:first-letter{font-size:24px}.nav{font-size:12px}.main{padding:18px}}

.project-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.project-summary{color:#64748b;font-size:14px}.project-summary strong{color:#172033;font-size:18px;margin-right:5px}.project-search{position:relative;width:min(280px,100%)}.project-search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8a96a8;font-size:18px}.project-search input{width:100%;height:40px;padding:0 12px 0 37px;border:1px solid #dce3ed;border-radius:9px;background:white;outline:none}.project-search input:focus{border-color:#6685f8;box-shadow:0 0 0 3px #315efb14}.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}.project-card{display:flex;flex-direction:column;min-height:265px;background:white;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.project-card:hover{transform:translateY(-2px);border-color:#c8d4e7;box-shadow:0 10px 28px #17203312}.project-body{flex:1;padding:20px}.project-head{display:flex;align-items:flex-start;gap:13px}.project-avatar{display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:11px;background:hsl(var(--project-hue) 78% 94%);color:hsl(var(--project-hue) 68% 39%);font-size:19px;font-weight:700;text-transform:uppercase}.project-title{min-width:0;flex:1}.project-title h3{margin:1px 0 5px;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-key{display:block;color:#7a879a;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:5px 8px;border-radius:999px;background:#edf9f2;color:#238552;font-size:12px}.status-chip i{width:6px;height:6px;border-radius:50%;background:#2db36c}.status-chip.off{background:#f1f3f6;color:#7b8492}.status-chip.off i{background:#929baa}.project-description{height:42px;margin:17px 0;color:#5f6d80;font-size:14px;line-height:21px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.project-metrics{display:flex;align-items:center;gap:24px;padding-top:15px;border-top:1px solid #eef1f5}.project-metric{display:flex;align-items:baseline;gap:6px}.project-metric strong{font-size:18px}.project-metric span{color:#8290a4;font-size:12px}.project-updated{margin-left:auto;color:#9aa5b5;font-size:12px}.project-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e9edf3;background:#fbfcfe}.project-action{border:0;border-right:1px solid #e9edf3;background:transparent;padding:12px;color:#40516a;cursor:pointer}.project-action:last-child{border-right:0}.project-action:hover{background:#f2f6ff;color:#315efb}.empty-projects{grid-column:1/-1;padding:55px 20px;text-align:center;background:white;border:1px dashed #ccd6e4;border-radius:14px;color:#7d8999}.empty-projects strong{display:block;margin-bottom:7px;color:#425069}@media(max-width:700px){.project-toolbar{align-items:stretch;flex-direction:column}.project-search{width:100%}.project-grid{grid-template-columns:1fr}.project-updated{display:none}}
.docs{max-width:920px}.docs h3{margin:28px 0 10px}.docs h3:first-child{margin-top:0}.docs p{line-height:1.7;color:#4d5b70}.docs code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.code-block{position:relative;margin:12px 0 20px;padding:18px;background:#172033;color:#dce6f7;border-radius:10px;overflow:auto;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.65}.doc-table{width:100%;border-collapse:collapse}.doc-table th,.doc-table td{padding:11px 12px;text-align:left;border-bottom:1px solid #e8edf4}.doc-table th{color:#64748b;font-size:13px}.method{display:inline-block;min-width:44px;color:#14804a;font-weight:700}.notice{padding:12px 14px;border-left:4px solid #315efb;background:#eef3ff;border-radius:6px;line-height:1.6}
.project-actions{grid-template-columns:repeat(3,1fr)}.project-action{padding:12px 6px}.overview-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:20px}.metric-card{background:white;border:1px solid #e3e8ef;border-radius:12px;padding:17px}.metric-card strong{display:block;font-size:25px;margin:6px 0}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-head h3{margin:0}.alert-item{padding:12px 14px;background:#fff8e8;border:1px solid #f2d28b;border-radius:9px;color:#76510b}.scope{display:inline-block;margin:2px;padding:3px 6px;border-radius:5px;background:#eef3ff;color:#315efb;font-size:11px}.inline-actions{display:flex;gap:7px;flex-wrap:wrap}.btn.small{padding:6px 9px;font-size:12px}@media(max-width:900px){.overview-grid{grid-template-columns:repeat(2,1fr)}}
.config-table{border:1px solid #e3e8ef;border-radius:12px;overflow:hidden}.config-table .table{border-radius:12px}.config-table .table th{background:#f8fafc;color:#68768a;font-size:12px;font-weight:600}.config-table .table td{height:62px;vertical-align:middle}.config-table .table tr:last-child td{border-bottom:0}.config-identity{display:flex;align-items:center;gap:10px;min-width:220px}.config-key{color:#26364d;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace}.config-value-preview{display:flex;align-items:center;max-width:440px;min-height:34px;margin:0;padding:7px 10px;border:1px solid #e6ebf2;border-radius:7px;background:#f8fafc;color:#4d5d72;font:12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.config-version{display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:4px 7px;border-radius:6px;background:#f0f3f8;color:#66758a;font-size:12px}.config-actions{min-width:170px}.config-actions .inline-actions{align-items:center}
.config-source-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#f2f5f9;border-radius:10px}.config-source-tab{border:0;border-radius:7px;padding:9px 12px;background:transparent;color:#637086;cursor:pointer}.config-source-tab.active{background:white;color:#244ed6;box-shadow:0 1px 4px #17203318;font-weight:600}.excel-upload{position:relative;padding:22px;border:1px dashed #b9c6d9;border-radius:10px;background:#f8fafc;text-align:center;color:#526177;transition:.18s}.excel-upload:hover{border-color:#6685f8;background:#f5f7ff}.excel-upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.excel-upload strong{display:block;margin-bottom:5px;color:#26364d}.excel-status{min-height:20px;margin-top:8px;color:#738096;font-size:13px}.excel-sheet-list{display:grid;gap:8px;margin:12px 0}.excel-sheet-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#fbfcfe}.excel-sheet-item code{color:#26364d;font-weight:600}.excel-sheet-item span{color:#78869a;font-size:12px}.excel-batch-hint{padding:10px 12px;border-radius:8px;background:#eef3ff;color:#40577a;font-size:13px;line-height:1.6}.field input[readonly],.field textarea[readonly]{background:#f8fafc;color:#526177}.config-dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.top-actions{display:flex;align-items:center;gap:9px}.back-button{display:none;align-items:center;gap:5px;border:1px solid #d8e0eb;border-radius:8px;padding:9px 13px;background:white;color:#40516a;cursor:pointer}.back-button:hover{border-color:#aebbd0;color:#315efb}.project-card[role=button]{cursor:pointer;outline:none}.project-card[role=button]:focus-visible{border-color:#6685f8;box-shadow:0 0 0 3px #315efb20}.project-actions{grid-template-columns:repeat(4,1fr)}.analytics-bars{display:grid;gap:10px}.analytics-bar-row{display:grid;grid-template-columns:90px 1fr 50px;align-items:center;gap:12px;font-size:13px}.analytics-bar-track{height:10px;border-radius:999px;background:#edf1f6;overflow:hidden}.analytics-bar-fill{height:100%;min-width:2px;border-radius:999px;background:linear-gradient(90deg,#315efb,#6d8cff)}.analytics-help{margin-top:18px;padding:16px;border:1px solid #dce5f3;border-radius:10px;background:#f8faff}.analytics-help code{color:#284bc1}@media(max-width:700px){.top{align-items:flex-start;gap:12px}.top-actions{flex-wrap:wrap;justify-content:flex-end}.project-actions{grid-template-columns:repeat(2,1fr)}.analytics-bar-row{grid-template-columns:76px 1fr 38px}}
</style></head><body>
<section id="login" class="login"><h1>游戏数据中心</h1><p>统一管理游戏配置与玩家云存档</p><div class="field"><label>用户名</label><input id="username" value="admin"></div><div class="field"><label>密码</label><input id="password" type="password"></div><button class="btn" onclick="login()">登录</button></section>
<div id="layout" class="layout"><aside class="side"><div class="brand">🎮 数据中心</div><button class="nav active" onclick="showGames(this)">游戏项目</button><button class="nav" onclick="leaveProjectPage();showAdmins(this)">管理员</button><button class="nav" onclick="leaveProjectPage();showDocs(this);showTrustedServerDocs();showProductionDocs()">接口文档</button><button class="nav" onclick="logout()">退出登录</button></aside><main class="main"><div class="top"><div><h2 id="title">游戏项目</h2><div class="muted" id="subtitle">按项目隔离配置和玩家数据</div></div><div class="top-actions"><button id="backButton" class="back-button" onclick="showGames()">← 返回项目</button><button id="primary" class="btn" onclick="openGame()">+ 新建游戏</button></div></div><div id="content"></div></main></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast"></div>
<script>
let token='',games=[],selected=null,configSource='json',excelConfigSheets=[],analyticsDefinitions=[],analyticsDays=7;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,opt={})=>{let headers=new Headers(opt.headers||{});if(token)headers.set('Authorization','Bearer '+token);if(opt.body!==undefined&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');let r=await fetch(path,{...opt,headers,credentials:'same-origin'}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'请求失败');return j};
function notify(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',3500)}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});start()}catch(e){notify(e.message)}}
async function logout(){await api('/api/admin/logout',{method:'POST'}).catch(()=>{});location.reload()}
async function start(){loginEl=document.getElementById('login');loginEl.style.display='none';layout.style.display='flex';try{await showGames()}catch(e){layout.style.display='none';loginEl.style.display='grid'}}
function enterProjectPage(){document.getElementById('backButton').style.display='inline-flex'}
function leaveProjectPage(){document.getElementById('backButton').style.display='none'}
function projectHue(key){return [...String(key)].reduce((sum,char)=>sum+char.charCodeAt(0),0)%360}
function projectCard(g){let initial=Array.from(String(g.name||g.game_key))[0]||'G',updated=new Date(g.updated_at).toLocaleDateString(),stop="event.stopPropagation()";return `<article class="project-card" role="button" tabindex="0" aria-label="进入 ${esc(g.name)} 项目概览" onclick="showProject('${g.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showProject('${g.id}')}\"><div class="project-body"><div class="project-head"><div class="project-avatar" style="--project-hue:${projectHue(g.game_key)}">${esc(initial)}</div><div class="project-title"><h3 title="${esc(g.name)}">${esc(g.name)}</h3><code class="project-key" title="${esc(g.game_key)}">${esc(g.game_key)}</code></div><span class="status-chip ${g.enabled?'':'off'}"><i></i>${g.enabled?'运行中':'已停用'}</span></div><p class="project-description">${esc(g.description||'暂无项目说明')}</p><div class="project-metrics"><div class="project-metric"><strong>${g.config_count}</strong><span>项配置</span></div><div class="project-metric"><strong>${g.user_count}</strong><span>位用户</span></div><span class="project-updated">更新于 ${updated}</span></div></div><div class="project-actions"><button class="project-action" onclick="${stop};showProject('${g.id}')">项目概览</button><button class="project-action" onclick="${stop};showAnalytics('${g.id}')">运营数据</button><button class="project-action" onclick="${stop};showConfigs('${g.id}')">配置管理</button><button class="project-action" onclick="${stop};showUsers('${g.id}')">玩家存档</button></div></article>`}
function renderProjects(list){let grid=document.getElementById('projectGrid');if(!grid)return;grid.innerHTML=list.length?list.map(projectCard).join(''):'<div class="empty-projects"><strong>没有找到匹配的项目</strong>试试其他名称或游戏标识</div>'}
function filterProjects(keyword){let q=String(keyword).trim().toLowerCase(),filtered=games.filter(g=>!q||g.name.toLowerCase().includes(q)||g.game_key.toLowerCase().includes(q)||(g.description||'').toLowerCase().includes(q));renderProjects(filtered)}
async function showGames(el){leaveProjectPage();selected=null;title.textContent='项目总览';subtitle.textContent='集中管理游戏配置与玩家数据';primary.style.display='block';primary.textContent='+ 新建游戏';primary.onclick=openGame;games=await api('/api/admin/games');content.innerHTML=`<div class="project-toolbar"><div class="project-summary"><strong>${games.length}</strong>个游戏项目</div><label class="project-search"><span>⌕</span><input aria-label="搜索项目" placeholder="搜索名称、标识或说明" oninput="filterProjects(this.value)"></label></div><div id="projectGrid" class="project-grid"></div>`;renderProjects(games);if(el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active')}}
async function showProject(id){enterProjectPage();selected=games.find(x=>x.id===id);title.textContent=selected.name+' / 概览';subtitle.textContent=selected.game_key+' · 运行指标、密钥和操作记录';primary.style.display='block';primary.textContent='项目设置';primary.onclick=openProjectSettings;let [metrics,alerts,keys,logs]=await Promise.all([api(`/api/admin/games/${id}/metrics?days=7`),api(`/api/admin/games/${id}/alerts`),api(`/api/admin/games/${id}/keys`),api(`/api/admin/games/${id}/audit-logs?limit=20`)]),summary=metrics.daily.reduce((x,d)=>({requests:x.requests+Number(d.requests||0),errors:x.errors+Number(d.errors||0),duration:x.duration+Number(d.avg_duration_ms||0)}),{requests:0,errors:0,duration:0}),errorRate=summary.requests?summary.errors/summary.requests*100:0,avg=metrics.daily.length?summary.duration/metrics.daily.length:0;content.innerHTML=`<div class="overview-grid"><div class="metric-card"><span class="muted">近 7 日请求</span><strong>${summary.requests}</strong><span class="muted">API 调用次数</span></div><div class="metric-card"><span class="muted">错误请求</span><strong>${summary.errors}</strong><span class="muted">错误率 ${errorRate.toFixed(2)}%</span></div><div class="metric-card"><span class="muted">平均耗时</span><strong>${avg.toFixed(0)} ms</strong><span class="muted">按日平均</span></div><div class="metric-card"><span class="muted">数据规模</span><strong>${selected.user_count}</strong><span class="muted">用户 · ${selected.config_count} 配置</span></div></div>${alerts.alerts.length?alerts.alerts.map(x=>`<div class="alert-item">⚠ ${esc(x.message)}</div>`).join(''):'<div class="panel muted">✓ 当前没有运营告警</div>'}<section class="section"><div class="section-head"><h3>API Key</h3><div class="inline-actions"><button class="btn small" onclick="openNewKey()">+ 新建密钥</button><button class="btn secondary small" onclick="exportConfigs()">导出配置</button><button class="btn secondary small" onclick="openImportConfigs()">导入配置</button></div></div><table class="table"><thead><tr><th>名称</th><th>权限</th><th>最近使用</th><th>状态</th><th></th></tr></thead><tbody>${keys.map(k=>`<tr><td>${esc(k.name)}</td><td>${k.scopes.map(s=>`<span class="scope">${esc(s)}</span>`).join('')}</td><td>${k.last_used_at?new Date(k.last_used_at).toLocaleString():'从未使用'}</td><td>${k.enabled?'启用':'停用'}</td><td><button class="btn ${k.enabled?'danger':'secondary'} small" onclick="toggleKey('${k.id}',${!k.enabled})">${k.enabled?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table></section><section class="section"><div class="section-head"><h3>最近操作</h3></div><table class="table"><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>资源</th></tr></thead><tbody>${logs.length?logs.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.admin_name||x.actor_type)}</td><td><code>${esc(x.action)}</code></td><td>${esc(x.resource_type)} ${esc(x.resource_id||'')}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">暂无操作记录</td></tr>'}</tbody></table></section>`}
async function showAnalytics(id,days=7){enterProjectPage();analyticsDays=days;selected=games.find(x=>x.id===id);title.textContent=selected.name+' / 运营数据';subtitle.textContent=selected.game_key+' · 本项目自定义玩家行为事件';primary.style.display='block';primary.textContent='+ 新增打点';primary.onclick=()=>openEventDefinition();let summary;[summary,analyticsDefinitions]=await Promise.all([api(`/api/admin/games/${id}/analytics?days=${days}`),api(`/api/admin/games/${id}/event-definitions`)]);let activeCount=analyticsDefinitions.filter(x=>x.enabled).length,max=Math.max(1,...summary.daily.map(x=>Number(x.count||0))),countByKey=Object.fromEntries(summary.by_event.map(x=>[x.event_key,x])),example=analyticsDefinitions.find(x=>x.enabled)?.event_key||'your_event_key',rows=analyticsDefinitions.length?analyticsDefinitions.map(x=>{let count=countByKey[x.event_key]||{};return `<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.description||'暂无说明')}</div></td><td><code>${esc(x.event_key)}</code></td><td><span class="pill">${esc(x.category)}</span></td><td><span class="status-chip ${x.enabled?'':'off'}"><i></i>${x.enabled?'启用':'停用'}</span></td><td>${count.count||0}</td><td>${count.unique_actors||0}</td><td><div class="inline-actions"><button class="btn secondary small" onclick="openEventDefinition('${x.id}')">编辑</button><button class="btn secondary small" onclick="toggleEventDefinition('${x.id}',${!x.enabled})">${x.enabled?'停用':'启用'}</button><button class="btn danger small" onclick="deleteEventDefinition('${x.id}')">删除</button></div></td></tr>`}).join(''):'<tr><td colspan="7" class="muted" style="text-align:center;padding:42px">此项目还没有打点，点击右上角“新增打点”创建自己的事件。</td></tr>';content.innerHTML=`<div class="row space" style="margin-bottom:14px"><span class="muted">统计范围包含今天，共 ${summary.days} 天</span><select aria-label="统计周期" onchange="showAnalytics('${id}',Number(this.value))"><option value="7" ${days===7?'selected':''}>近 7 天</option><option value="30" ${days===30?'selected':''}>近 30 天</option><option value="90" ${days===90?'selected':''}>近 90 天</option></select></div><div class="overview-grid"><div class="metric-card"><span class="muted">总事件数</span><strong>${summary.total_events}</strong><span class="muted">所选周期内</span></div><div class="metric-card"><span class="muted">今日事件</span><strong>${summary.today_events}</strong><span class="muted">截至当前</span></div><div class="metric-card"><span class="muted">触发玩家</span><strong>${summary.unique_actors}</strong><span class="muted">玩家或设备去重</span></div><div class="metric-card"><span class="muted">项目事件</span><strong>${activeCount} / ${analyticsDefinitions.length}</strong><span class="muted">启用 / 全部定义</span></div></div><section class="panel"><div class="section-head"><h3>事件趋势</h3></div><div class="analytics-bars">${summary.daily.map(x=>`<div class="analytics-bar-row"><span>${esc(x.date.slice(5))}</span><div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:${Number(x.count||0)/max*100}%"></div></div><b>${x.count}</b></div>`).join('')}</div></section><section class="section"><div class="section-head"><h3>项目打点</h3><span class="muted">每个项目独立维护事件名称、event_key 和分类</span></div><table class="table"><thead><tr><th>事件名称</th><th>event_key</th><th>分类</th><th>状态</th><th>触发次数</th><th>去重玩家</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table><div class="analytics-help"><b>客户端接入示例</b><p class="muted">先在上方定义事件，再使用相同的 event_key 上报；幂等键可避免网络重试产生重复数据。</p><code>client.trackEvent('${esc(example)}', { source: 'game' })</code></div></section>`}

function showTrustedServerDocs(){let statusHeading=[...content.querySelectorAll('h3')].find(x=>x.textContent==='状态码');statusHeading?.insertAdjacentHTML('beforebegin',`<h3>解析用户</h3><p>该接口需要具有 <code>user:resolve</code> 权限的服务端 Key。正式项目应由可信业务服务验证平台登录凭证后调用。</p><div class="code-block">POST /api/client/users/resolve\nX-Game-Id: puzzle_01\nX-Api-Key: gk_server_key\nContent-Type: application/json\n\n{ "openid": "wx-openid", "user_id": "account-1001" }</div><p>响应包含两小时有效的 <code>user_token</code>，客户端后续只用该 Token 访问自己的存档。</p>`)}
function showDocs(el){selected=null;title.textContent='接口文档';subtitle.textContent='游戏客户端获取远程配置的接入说明';primary.style.display='none';document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el?.classList.add('active');content.innerHTML=`<article class="panel docs"><h3>接入信息</h3><p>创建游戏后会得到游戏标识和 API Key。客户端请求配置接口时，需要在请求头中同时携带这两个凭证。</p><div class="notice"><b>基础地址：</b><code>${esc(location.origin)}</code><br><b>游戏标识：</b>后台“游戏项目”卡片上的 game_key<br><b>API Key：</b>创建游戏时生成且只显示一次</div><h3>鉴权请求头</h3><div class="code-block">X-Game-Id: puzzle_01\nX-Api-Key: gk_xxxxxxxxx\nContent-Type: application/json</div><h3>配置接口</h3><table class="doc-table"><thead><tr><th>请求</th><th>路径</th><th>说明</th></tr></thead><tbody><tr><td><span class="method">GET</span></td><td><code>/api/client/configs</code></td><td>获取指定环境的全部配置</td></tr><tr><td><span class="method">GET</span></td><td><code>/api/client/configs/:key</code></td><td>获取指定配置键</td></tr></tbody></table><h3>获取全部配置</h3><p><code>environment</code> 可选，默认为 <code>production</code>，也可以传 <code>staging</code> 或 <code>development</code>。</p><div class="code-block">curl '${esc(location.origin)}/api/client/configs?environment=production' \\\n  -H 'X-Game-Id: puzzle_01' \\\n  -H 'X-Api-Key: gk_xxxxxxxxx'</div><p>JavaScript 示例：</p><div class="code-block">const response = await fetch(\n  '${esc(location.origin)}/api/client/configs?environment=production',\n  {\n    headers: {\n      'X-Game-Id': 'puzzle_01',\n      'X-Api-Key': 'gk_xxxxxxxxx'\n    }\n  }\n);\n\nif (!response.ok) throw new Error('配置获取失败');\nconst result = await response.json();\nconsole.log(result.configs);</div><h3>返回数据</h3><div class="code-block">{\n  "game_id": "puzzle_01",\n  "environment": "production",\n  "configs": {\n    "global": {\n      "value": { "notice": "欢迎进入游戏", "maintenance": false },\n      "version": 3,\n      "updated_at": "2026-07-23T00:00:00.000Z"\n    }\n  }\n}</div><h3>获取单项配置</h3><div class="code-block">GET /api/client/configs/global?environment=production</div><p>其中 <code>global</code> 是后台创建配置时填写的配置键。</p><h3>状态码</h3><table class="doc-table"><tbody><tr><td><code>200</code></td><td>请求成功</td></tr><tr><td><code>401</code></td><td>缺少凭证、API Key 错误或游戏已停用</td></tr><tr><td><code>404</code></td><td>指定配置键不存在</td></tr><tr><td><code>500</code></td><td>服务内部错误</td></tr></tbody></table><h3>安全提示</h3><p>拥有 API Key 的调用方可以访问该游戏的数据接口。正式项目不要将具备存档写权限的 Key 直接放入容易反编译的公开客户端，建议由可信业务服务转调。</p></article>`}
function showArchiveDocs(){let statusHeading=[...content.querySelectorAll('h3')].find(x=>x.textContent==='状态码');statusHeading?.insertAdjacentHTML('beforebegin',`<h3>获取用户存档数据</h3><p>存档接口使用系统内部用户 ID。客户端先用 OpenID 或业务用户 ID 调用解析接口，取得返回结果中的 <code>id</code>，再读取对应存档槽。</p><p><b>第一步：解析用户</b></p><div class="code-block">curl -X POST '${esc(location.origin)}/api/client/users/resolve' \\\n+  -H 'Content-Type: application/json' \\\n+  -H 'X-Game-Id: puzzle_01' \\\n+  -H 'X-Api-Key: gk_xxxxxxxxx' \\\n+  -d '{"openid":"wx-openid","user_id":"account-1001"}'</div><p>解析接口返回内部用户 ID：</p><div class="code-block">{\n  "id": "57b57e28-8919-4d09-81d1-a9d5de60ad5e",\n  "openid": "wx-openid",\n  "external_user_id": "account-1001",\n  "profile": {}\n}</div><p><b>第二步：读取存档槽</b></p><div class="code-block">curl '${esc(location.origin)}/api/client/users/57b57e28-8919-4d09-81d1-a9d5de60ad5e/archives/default' \\\n+  -H 'X-Game-Id: puzzle_01' \\\n+  -H 'X-Api-Key: gk_xxxxxxxxx'</div><p><code>default</code> 是存档槽名称，一个用户可以拥有多个槽位。</p><div class="code-block">{\n  "id": "archive-uuid",\n  "slot": "default",\n  "data": {\n    "level": 12,\n    "coins": 880,\n    "inventory": ["sword"]\n  },\n  "version": 3,\n  "updated_at": "2026-07-23T00:00:00.000Z"\n}</div>`)}
function showProductionDocs(){let statusHeading=[...content.querySelectorAll('h3')].find(x=>x.textContent==='状态码');statusHeading?.insertAdjacentHTML('beforebegin',`<h3>推荐：用户 Token 存档接口</h3><p>公开客户端不要携带拥有全部玩家存档权限的服务端 Key。解析用户后保存返回的 <code>user_token</code>，后续通过当前用户路径访问自己的存档。</p><div class="code-block">GET /api/client/me/archives/default\nAuthorization: Bearer &lt;user_token&gt;</div><div class="code-block">PUT /api/client/me/archives/default\nAuthorization: Bearer &lt;user_token&gt;\nIdempotency-Key: &lt;每次写入唯一 UUID&gt;\nContent-Type: application/json\n\n{\n  "version": 3,\n  "data": { "level": 13, "coins": 920 }\n}</div><p>已有存档更新必须携带当前 <code>version</code>，版本冲突返回 409；单份存档默认最大 256 KB。</p><h3>机器可读文档与 SDK</h3><p><a href="/openapi.json" target="_blank">查看 OpenAPI JSON</a> · <a href="/sdk/game-client.ts" target="_blank">下载 TypeScript/Cocos SDK</a></p>`)}

async function createGame(){try{let x=await api('/api/admin/games',{method:'POST',body:JSON.stringify({game_key:gkey.value,name:gname.value,description:gdesc.value})});dialog.innerHTML=`<h3>创建成功</h3><p>请立即保存 API Key，关闭后无法再次查看。</p><div id="apiKeyText" class="api-key-box">${esc(x.api_key)}</div><div class="row"><button class="btn" onclick="copyApiKey()">复制 API Key</button><button class="btn secondary" onclick="closeModal();showGames()">已保存并关闭</button></div>`}catch(e){notify(e.message)}}
async function copyApiKey(){let value=document.getElementById('apiKeyText')?.textContent||'';try{await navigator.clipboard.writeText(value);notify('API Key 已复制')}catch{let helper=document.createElement('textarea');helper.value=value;helper.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.appendChild(helper);helper.select();let copied=document.execCommand('copy');helper.remove();notify(copied?'API Key 已复制':'复制失败，请手动选择文本复制')}}
async function showConfigs(id){selected=games.find(x=>x.id===id);title.textContent=selected.name+' / 配置';subtitle.textContent='草稿、发布历史与版本回滚';primary.style.display='block';primary.textContent='+ 新建配置';primary.onclick=openConfig;let rows=await api(`/api/admin/games/${id}/configs`);content.innerHTML=`<div class="config-table"><table class="table"><thead><tr><th>环境 / 配置键</th><th>配置内容</th><th>版本</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><div class="config-identity"><span class="pill">${esc(x.environment)}</span><code class="config-key">${esc(x.config_key)}</code></div></td><td><code class="config-value-preview" title="${esc(JSON.stringify(x.value))}">${esc(JSON.stringify(x.value))}</code></td><td><span class="config-version">v${x.version}</span></td><td class="config-actions"><div class="inline-actions"><button class="btn secondary small" onclick='editConfig(${JSON.stringify(JSON.stringify(x))})'>编辑</button><button class="btn secondary small" onclick="showConfigHistory('${x.id}')">历史</button><button class="btn danger small" onclick="deleteConfig('${x.id}')">删除</button></div></td></tr>`).join(''):'<tr><td colspan="4" class="muted" style="text-align:center;padding:40px">暂无配置，点击右上角新建配置</td></tr>'}</tbody></table></div>`}
function openConfig(){configSource='json';excelConfigSheets=[];dialog.innerHTML=`<h3>新建配置</h3><div class="config-source-tabs"><button id="jsonSourceTab" class="config-source-tab active" type="button" onclick="setConfigSource('json')">JSON 配置</button><button id="excelSourceTab" class="config-source-tab" type="button" onclick="setConfigSource('excel')">Excel 表格</button></div><div id="excelSource" style="display:none"><div class="field"><label>Excel 文件</label><div class="excel-upload"><input id="excelFile" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="handleExcelFile(this.files[0])"><strong>点击选择 .xls / .xlsx 文件</strong><span class="muted">每个工作表生成一条配置，最多 5 MB</span></div><div id="excelStatus" class="excel-status">上传后自动读取全部工作表</div></div><div id="excelSheetsSummary" style="display:none"></div></div><div id="configKeyField" class="field"><label>配置键</label><input id="ckey" placeholder="例如：global"></div><div class="field"><label>环境</label><select id="cenv"><option>production</option><option>staging</option><option>development</option></select></div><div id="configValueField" class="field"><label>JSON 内容</label><textarea id="cvalue">{}</textarea></div><div class="config-dialog-actions"><button class="btn secondary" type="button" onclick="closeModal()">取消</button><button id="configSaveButton" class="btn" type="button" onclick="createConfig()">保存配置</button></div>`;modal.style.display='flex'}
function setConfigSource(source){configSource=source;let excel=source==='excel';jsonSourceTab.classList.toggle('active',!excel);excelSourceTab.classList.toggle('active',excel);excelSource.style.display=excel?'block':'none';configKeyField.style.display=excel?'none':'grid';configValueField.style.display=excel?'none':'grid';configSaveButton.textContent=excel?'添加全部工作表':'保存配置';if(!excel){ckey.value='';cvalue.value='{}'}renderExcelSheets()}
function fileAsBase64(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(Error('文件读取失败'));reader.readAsDataURL(file)})}
function renderExcelSheets(){let summary=document.getElementById('excelSheetsSummary');if(!summary)return;let visible=configSource==='excel'&&excelConfigSheets.length;summary.style.display=visible?'block':'none';if(!visible)return;summary.innerHTML=`<div class="excel-sheet-list">${excelConfigSheets.map(sheet=>`<div class="excel-sheet-item"><code>${esc(sheet.name)}</code><span>${sheet.row_count} 行 · ${sheet.column_count} 列</span></div>`).join('')}</div><div class="excel-batch-hint">点击“添加全部工作表”将一次保存 ${excelConfigSheets.length} 条配置，配置键使用工作表名；同环境下的同名配置会更新并生成新版本。</div>`}
async function handleExcelFile(file){if(!file)return;let status=document.getElementById('excelStatus');excelConfigSheets=[];renderExcelSheets();if(!/\.xlsx?$/i.test(file.name)){status.textContent='请选择 .xls 或 .xlsx 格式的 Excel 文件';return}if(file.size>5*1024*1024){status.textContent='Excel 文件不能超过 5 MB';return}status.textContent='正在解析全部工作表…';try{let result=await api('/api/admin/excel/convert',{method:'POST',body:JSON.stringify({filename:file.name,file_base64:await fileAsBase64(file)})});excelConfigSheets=result.sheets;status.textContent=`已读取 ${excelConfigSheets.length} 个工作表，将全部添加为配置`;renderExcelSheets()}catch(e){status.textContent=e.message;notify(e.message)}}
async function createConfig(){try{if(configSource==='excel'){if(!excelConfigSheets.length)throw Error('请先上传 Excel 文件');let configs=excelConfigSheets.map(sheet=>({config_key:sheet.name,environment:cenv.value,value:sheet.value,description:'Excel 工作表批量导入'})),result=await api(`/api/admin/games/${selected.id}/configs/import`,{method:'POST',body:JSON.stringify({configs})});closeModal();notify(`已添加 ${result.imported} 个工作表配置`);showConfigs(selected.id);return}let key=ckey.value.trim();if(!key)throw Error('请填写配置键');let value=JSON.parse(cvalue.value);await api(`/api/admin/games/${selected.id}/configs`,{method:'POST',body:JSON.stringify({config_key:key,environment:cenv.value,value})});closeModal();notify('配置已保存');showConfigs(selected.id)}catch(e){notify(e.message)}}
function editConfig(raw){let x=JSON.parse(raw);dialog.innerHTML=`<h3>编辑 ${esc(x.config_key)}</h3><div class="field"><label>发布说明</label><input id="configNote" placeholder="说明本次修改内容"></div><div class="field"><label>JSON Schema（可选，填 null 可清除）</label><textarea id="configSchema">${esc(JSON.stringify(x.schema??null,null,2))}</textarea></div><div class="field"><label>JSON 内容</label><textarea id="cvalue">${esc(JSON.stringify(x.value,null,2))}</textarea></div><div class="row"><button class="btn" onclick="saveConfig('${x.id}')">保存并发布</button><button class="btn secondary" onclick="saveConfigDraft('${x.id}')">保存草稿</button></div>`;modal.style.display='flex'}
async function saveConfig(id){try{await api('/api/admin/configs/'+id,{method:'PUT',body:JSON.stringify({value:JSON.parse(cvalue.value),schema:JSON.parse(configSchema.value),note:configNote.value})});closeModal();notify('配置已校验并发布');showConfigs(selected.id)}catch(e){notify(e.message)}}
async function saveConfigDraft(id){try{await api(`/api/admin/configs/${id}/drafts`,{method:'POST',body:JSON.stringify({value:JSON.parse(cvalue.value),schema:JSON.parse(configSchema.value),note:configNote.value})});closeModal();notify('草稿已保存');showConfigHistory(id)}catch(e){notify(e.message)}}
async function showConfigHistory(id){let rows=await api(`/api/admin/configs/${id}/history`);dialog.innerHTML=`<h3>配置历史</h3>${rows.map(x=>`<div class="panel" style="margin:10px 0"><div class="row space"><b>v${x.version} · ${x.status==='draft'?'草稿':x.status==='published'?'当前发布':'历史版本'}</b><span class="muted">${new Date(x.created_at).toLocaleString()}</span></div><p class="muted">${esc(x.note||'无说明')} · ${esc(x.created_by_name||'系统')}</p><div class="inline-actions">${x.status==='draft'?`<button class="btn small" onclick="publishDraft('${id}','${x.id}')">发布草稿</button>`:`<button class="btn secondary small" onclick="rollbackConfig('${id}',${x.version})">回滚到此版本</button>`}</div></div>`).join('')}<button class="btn secondary" onclick="closeModal()">关闭</button>`;modal.style.display='flex'}
async function publishDraft(configId,revisionId){try{await api(`/api/admin/configs/${configId}/publish`,{method:'POST',body:JSON.stringify({revision_id:revisionId})});closeModal();notify('草稿已发布');showConfigs(selected.id)}catch(e){notify(e.message)}}
async function rollbackConfig(configId,version){if(!confirm(`确认回滚到 v${version}？系统会生成一个新版本。`))return;try{await api(`/api/admin/configs/${configId}/rollback`,{method:'POST',body:JSON.stringify({version})});closeModal();notify('配置已回滚并发布');showConfigs(selected.id)}catch(e){notify(e.message)}}
async function deleteConfig(id){if(!confirm('确认删除该配置？配置及其全部历史版本都会被删除。'))return;try{await api('/api/admin/configs/'+id,{method:'DELETE'});notify('配置已删除');await showConfigs(selected.id)}catch(e){notify(e.message)}}
async function showUsers(id){selected=games.find(x=>x.id===id);title.textContent=selected.name+' / 玩家';subtitle.textContent='按 OpenID 或业务用户 ID 查询';primary.style.display='none';let rows=await api(`/api/admin/games/${id}/users`);content.innerHTML=`<div class="field"><input placeholder="输入 OpenID / 用户 ID 后回车搜索" onkeydown="if(event.key==='Enter')searchUsers(this.value)"></div><table class="table"><thead><tr><th>OpenID</th><th>用户 ID</th><th>存档数</th><th>更新时间</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.openid||'-')}</td><td>${esc(x.external_user_id||'-')}</td><td>${x.archive_count}</td><td>${new Date(x.updated_at).toLocaleString()}</td><td><button class="btn secondary" onclick="showArchives('${x.id}')">查看存档</button></td></tr>`).join('')}</tbody></table>`}
async function searchUsers(q){let rows=await api(`/api/admin/games/${selected.id}/users?q=${encodeURIComponent(q)}`);document.querySelector('tbody').innerHTML=rows.map(x=>`<tr><td>${esc(x.openid||'-')}</td><td>${esc(x.external_user_id||'-')}</td><td>${x.archive_count}</td><td>${new Date(x.updated_at).toLocaleString()}</td><td><button class="btn secondary" onclick="showArchives('${x.id}')">查看存档</button></td></tr>`).join('')}
async function showArchives(uid){let rows=await api('/api/admin/users/'+uid+'/archives');dialog.innerHTML=`<h3>玩家存档</h3>${rows.length?rows.map(x=>`<div class="panel" style="margin:10px 0"><div class="row space"><b>${esc(x.slot)} · v${x.version}</b><div class="inline-actions"><button class="btn secondary small" onclick='editArchive(${JSON.stringify(JSON.stringify(x))})'>编辑</button><button class="btn secondary small" onclick="showArchiveHistory('${x.id}')">历史</button></div></div><code>${esc(JSON.stringify(x.data)).slice(0,180)}</code></div>`).join(''):'<p class="muted">暂无存档</p>'}<button class="btn secondary" onclick="closeModal()">关闭</button>`;modal.style.display='flex'}
function editArchive(raw){let x=JSON.parse(raw);dialog.innerHTML=`<h3>编辑存档 ${esc(x.slot)}</h3><p class="muted">当前版本 v${x.version}，保存时会校验版本以避免覆盖。</p><textarea id="avalue">${esc(JSON.stringify(x.data,null,2))}</textarea><button class="btn" onclick="saveArchive('${x.id}',${x.version})">保存</button>`}
async function saveArchive(id,version){try{await api('/api/admin/archives/'+id,{method:'PUT',body:JSON.stringify({data:JSON.parse(avalue.value),version})});closeModal();notify('存档已保存')}catch(e){notify(e.message)}}
async function showArchiveHistory(id){let rows=await api(`/api/admin/archives/${id}/history`);dialog.innerHTML=`<h3>存档历史</h3>${rows.map(x=>`<div class="panel" style="margin:10px 0"><div class="row space"><b>v${x.version} · ${esc(x.reason)}</b><span class="muted">${new Date(x.created_at).toLocaleString()}</span></div><code>${esc(JSON.stringify(x.data)).slice(0,180)}</code><div style="margin-top:10px"><button class="btn secondary small" onclick="restoreArchive('${id}',${x.version})">恢复此版本</button></div></div>`).join('')}<button class="btn secondary" onclick="closeModal()">关闭</button>`;modal.style.display='flex'}
async function restoreArchive(id,version){if(!confirm(`确认恢复存档 v${version}？`))return;try{await api(`/api/admin/archives/${id}/restore`,{method:'POST',body:JSON.stringify({version})});closeModal();notify('存档已恢复为新版本')}catch(e){notify(e.message)}}
function closeModal(){modal.style.display='none';excelConfigSheets=[]}
const showConfigsContent=showConfigs,showUsersContent=showUsers;
showConfigs=async id=>{enterProjectPage();return showConfigsContent(id)};
showUsers=async id=>{enterProjectPage();return showUsersContent(id)};
start();
</script></body></html>
