<!doctype html>
<html lang="zh-CN" data-theme="classic"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏数据中心</title>
<script src="/admin-theme.js"></script>
<link rel="stylesheet" href="/admin.css"></head><body>
<section id="login" class="login"><h1>游戏数据中心</h1><p>统一管理项目配置与玩家云存档</p><div class="field"><label>用户名</label><input id="username" value="admin"></div><div class="field"><label>密码</label><input id="password" type="password"></div><button class="btn" onclick="login()">登录</button></section>
<div id="layout" class="layout"><aside class="side"><div class="brand">🎮 数据中心</div><button class="nav active" onclick="showGames(this)">项目总览</button><button class="nav" onclick="leaveProjectPage();showAdmins(this)">管理员</button><button class="nav" onclick="leaveProjectPage();showDocs(this);showTrustedServerDocs();showProductionDocs()">接口文档</button><div class="side-spacer"></div><button class="nav settings-nav" onclick="showSettings(this)">设置</button><button class="nav logout-nav" onclick="logout()">退出登录</button></aside><main class="main"><div class="top"><div class="top-heading"><h2 id="title">项目总览</h2><div class="muted" id="subtitle">项目配置</div></div><nav id="projectTabs" class="project-tabs" aria-label="项目页面切换"></nav><div class="top-actions"><button id="backButton" class="back-button" onclick="showGames()">← 返回项目</button><button id="primary" class="btn" onclick="openGame()">+ 新建项目</button></div></div><div id="content"></div></main></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast"></div>
<script src="/admin-core.js"></script>
<script src="/admin-analytics.js"></script>
<script src="/admin-management.js"></script></body></html>
