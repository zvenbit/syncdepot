services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_center
      POSTGRES_USER: game_admin
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_admin -d game_center"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://game_admin:change_me@postgres:5432/game_center
      JWT_SECRET: replace-this-in-production-with-a-long-random-value
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-before-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
